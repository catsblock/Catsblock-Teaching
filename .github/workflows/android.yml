name: Android CI & Auto-Fix

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger it manually from your phone

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # STEP 1: Check if gradlew exists. If not, generate and commit it.
      - name: Check and Fix Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Gradlew missing! Generating..."
            gradle wrapper --gradle-version 8.2
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/
            git update-index --chmod=+x gradlew
            git commit -m "chore: auto-generate gradle wrapper"
            git push
            echo "Files pushed. This run will fail, but the NEXT push will work!"
            exit 1 # Stop this run so we don't loop
          fi

      # STEP 2: Standard Build
      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Catsblock-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

          
